<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Subterranean 3D Background Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
            color: #fff;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
        }
        #pause-screen, #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            text-align: center;
            cursor: pointer;
        }
        #pause-screen {
            display: none;
            pointer-events: none;
        }
        h1 {
            color: #0ff;
            font-size: 48px;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        p {
            color: #fff;
            font-size: 18px;
            margin-top: 5px;
        }
        .sub-text {
            color: #888;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- スタート画面 -->
    <div id="start-screen" onclick="startGame()">
        <h1>3D BACKGROUND</h1>
        <p>Press [Z] or Click to Start</p>
        <p class="sub-text">[F11] to Toggle Fullscreen</p>
    </div>

    <!-- ポーズ画面 -->
    <div id="pause-screen">
        <h1>PAUSE</h1>
        <p>[Esc] or [Z] to Resume</p>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
// --- 画像アセット ---
const hashiraImg = new Image();
hashiraImg.src = 'hashira.png';

const jimenImg = new Image();
jimenImg.src = 'jimen.png';

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// レスポンシブ解像度設定
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// --- 状態管理 ---
let frames = 0;
let isPaused = false;
let gameStarted = false;

// --- 3D描画パラメータ ---
const focalLength = 220;
const maxZ = 1000;

const pillars3D = [];
const pillarCount = 8;
for (let i = 0; i < pillarCount; i++) {
    pillars3D.push({ z: (i / pillarCount) * maxZ });
}

const snowParticles = [];
for (let i = 0; i < 100; i++) {
    snowParticles.push({
        x: (Math.random() - 0.5) * 1200,
        y: (Math.random() - 0.5) * 800,
        z: Math.random() * maxZ,
        size: 2 + Math.random() * 2.5
    });
}

// --- 入力イベント ---
window.addEventListener('keydown', (e) => {
    if (e.code === 'F11') {
        e.preventDefault();
        toggleFullscreen();
        return;
    }

    if (!gameStarted && (e.code === 'KeyZ' || e.code === 'KeyY')) {
        e.preventDefault();
        startGame();
        return;
    }

    if (e.code === 'Escape' && gameStarted) {
        e.preventDefault();
        togglePause();
        return;
    }

    if (isPaused && (e.code === 'KeyZ' || e.code === 'KeyY')) {
        e.preventDefault();
        togglePause();
        return;
    }
}, true);

function startGame() {
    if (!gameStarted) {
        gameStarted = true;
        isPaused = false;
        const startScreen = document.getElementById("start-screen");
        if (startScreen) startScreen.style.display = 'none';
        requestAnimationFrame(loop);
    }
}

function togglePause() {
    isPaused = !isPaused;
    const pauseScreen = document.getElementById("pause-screen");
    pauseScreen.style.display = isPaused ? 'flex' : 'none';

    if (!isPaused) {
        requestAnimationFrame(loop);
    }
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
            console.log(`全画面表示エラー: ${err.message}`);
        });
    } else {
        document.exitFullscreen();
    }
}

// --- 自由変形描画関数 ---
function drawWarpedImage(img, p1, p2, p3, p4, brightness) {
    if (!img.complete || img.naturalWidth === 0) return;
    
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.lineTo(p4.x, p4.y);
    ctx.closePath();
    ctx.clip();

    const minX = Math.min(p1.x, p2.x, p3.x, p4.x);
    const maxX = Math.max(p1.x, p2.x, p3.x, p4.x);
    const minY = Math.min(p1.y, p2.y, p3.y, p4.y);
    const maxY = Math.max(p1.y, p2.y, p3.y, p4.y);
    const w = Math.max(1, maxX - minX);
    const h = Math.max(1, maxY - minY);

    ctx.drawImage(img, minX, minY, w, h);

    if (brightness < 1.0) {
        ctx.fillStyle = `rgba(0,0,0,${1.0 - brightness})`;
        ctx.fillRect(minX, minY, w, h);
    }
    ctx.restore();
}

// --- メインループ ---
function loop() {
    if (!isPaused && gameStarted) {
        update();
        draw();
        requestAnimationFrame(loop);
    }
}

function update() {
    frames++;
}

// --- 描画処理 ---
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const fovCenterX = canvas.width / 2;
    const fovCenterY = canvas.height / 2;

    // 背景グラデーション
    const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    bgGrad.addColorStop(0, '#1c1b22');
    bgGrad.addColorStop(0.5, '#2c2a35');
    bgGrad.addColorStop(1, '#0f0e14');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const speedZ = 6;

    // 柱の進行
    pillars3D.forEach(p => {
        p.z -= speedZ;
        if (p.z <= 10) p.z += maxZ;
    });

    // 奥から手前へソート
    pillars3D.sort((a, b) => b.z - a.z);

    const pillarData = pillars3D.map(p => {
        const scale = focalLength / p.z;
        const alpha = Math.min(1, Math.max(0, (maxZ - p.z) / 300));
        
        const baseSpread = canvas.width * 0.22; 
        const interval = canvas.width * 0.14;  

        const coords = [];
        let step = 0;
        while (true) {
            const dist = (baseSpread + step * interval) * scale;
            const rightX = fovCenterX + dist;
            const leftX = fovCenterX - dist;
            
            if (rightX > canvas.width + 400 && leftX < -400) break;
            
            coords.push(leftX);
            coords.push(rightX);
            step++;
            if (step > 15) break; 
        }
        coords.sort((a, b) => a - b);

        const baseH = canvas.height * 1.25 + (1 - (p.z / maxZ)) * (canvas.height * 0.75);
        const pillarH = baseH * scale;
        const faceW = 20 * scale;

        const topY = fovCenterY - pillarH * 0.7;
        const bottomY = fovCenterY + pillarH * 0.3;

        return {
            z: p.z, scale, alpha, 
            coords: coords,
            faceW, topY, bottomY
        };
    });

    // 1. 床パネル（jimen.png）描画
    for (let i = 0; i < pillarData.length - 1; i++) {
        const far = pillarData[i];
        const near = pillarData[i + 1];

        if (near.z < far.z && (far.z - near.z) < (maxZ / pillarCount) * 2.5) {
            ctx.save();
            ctx.globalAlpha = Math.min(far.alpha, near.alpha);

            const leftmostFar = far.coords[0];
            const rightmostFar = far.coords[far.coords.length - 1];
            const leftmostNear = near.coords[0];
            const rightmostNear = near.coords[near.coords.length - 1];

            const p1_floor = { x: leftmostFar - far.faceW * 4.0, y: far.bottomY };
            const p2_floor = { x: rightmostFar + far.faceW * 4.0, y: far.bottomY };
            const p3_floor = { x: rightmostNear + near.faceW * 4.0, y: near.bottomY };
            const p4_floor = { x: leftmostNear - near.faceW * 4.0, y: near.bottomY };

            drawWarpedImage(jimenImg, p1_floor, p2_floor, p3_floor, p4_floor, 0.85);
            ctx.restore();
        }
    }

    // 2. 生成されたすべての柱を描画
    pillarData.forEach(p => {
        const { alpha, coords, faceW, topY, bottomY } = p;

        coords.forEach((cx) => {
            ctx.save();
            ctx.globalAlpha = alpha;

            const p1_left = { x: cx - faceW * 1.5, y: topY };
            const p2_left = { x: cx - faceW * 0.5, y: topY };
            const p3_left = { x: cx - faceW * 0.5, y: bottomY };
            const p4_left = { x: cx - faceW * 1.5, y: bottomY };

            const p1_mid = { x: cx - faceW * 0.5, y: topY };
            const p2_mid = { x: cx + faceW * 0.5, y: topY };
            const p3_mid = { x: cx + faceW * 0.5, y: bottomY };
            const p4_mid = { x: cx - faceW * 0.5, y: bottomY };

            const p1_right = { x: cx + faceW * 0.5, y: topY };
            const p2_right = { x: cx + faceW * 1.5, y: topY };
            const p3_right = { x: cx + faceW * 1.5, y: bottomY };
            const p4_right = { x: cx + faceW * 0.5, y: bottomY };

            drawWarpedImage(hashiraImg, p1_left, p2_left, p3_left, p4_left, 0.6);
            drawWarpedImage(hashiraImg, p1_mid, p2_mid, p3_mid, p4_mid, 1.0);
            drawWarpedImage(hashiraImg, p1_right, p2_right, p3_right, p4_right, 0.65);

            ctx.restore();
        });
    });

    // 3. 粒子（雪ふぶき風）描画
    snowParticles.forEach(sp => {
        sp.z -= speedZ * 0.8;
        if (sp.z <= 10) sp.z += maxZ;

        const scale = focalLength / sp.z;
        const projX = fovCenterX + (sp.x * scale);
        const projY = fovCenterY + (sp.y * scale) + (frames * 0.5) % canvas.height;
        let wrappedY = projY % canvas.height;
        if (wrappedY < 0) wrappedY += canvas.height;

        const projSize = Math.max(1, sp.size * scale);
        const alpha = Math.min(0.8, (maxZ - sp.z) / 300);

        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.beginPath();
        ctx.arc(projX, wrappedY, projSize, 0, Math.PI * 2);
        ctx.fill();
    });
}
</script>
</body>
</html>
