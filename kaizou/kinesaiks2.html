<html lang="ja"><head>
    <meta charset="UTF-8">
    <title>kinesaiks Subterranean Extra</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        /* ゲーム全体を包むコンテナ（常に画面中央に配置） */
        #game-container { 
            position: relative; 
            border: 2px solid #555; 
            width: 450px; 
            height: 600px; 
            max-width: 100vw; 
            max-height: 100vh;
            display: flex; 
            justify-content: center; 
            align-items: center;
        }

        /* キャンバスをコンテナいっぱいに、かつアスペクト比を維持して中央配置 */
        canvas { 
            background: #050510; 
            display: block; 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            cursor: pointer;
        }

        #ui { position: absolute; top: 0; left: 0; width: 100%; padding: 10px; box-sizing: border-box; pointer-events: none; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
        .hp-bar-container { width: 150px; }
        .hp-bar-bg { width: 100%; height: 6px; background: #333; margin-top: 5px; border: 1px solid #777; }
        #hp-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #f00, #ff0); transition: width 0.1s; }
        .info { font-size: 14px; text-shadow: 1px 1px 2px #000; display: flex; gap: 15px; }
        
        #pause-screen, .overlay-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 30; text-align: center; }
        .dialog-btn { margin-top: 20px; background: #111; color: #0ff; border: 2px solid #0ff; padding: 10px 20px; font-family: 'Courier New', monospace; font-size: 16px; cursor: pointer; }
        .dialog-btn:hover { background: #0ff; color: #000; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">
        <div class="info">
            <span>STAGE: <b id="stage-val">EXTRA</b></span>
            <span>SCORE: <b id="score-val">0</b></span>
        </div>
        <div class="hp-bar-container">
            <div style="font-size:11px;" id="boss-hp-label">BOSS HP</div>
            <div class="hp-bar-bg"><div id="hp-bar-fill" style="width: 100%;"></div></div>
        </div>
    </div>

    <!-- ポーズ画面 -->
    <div id="pause-screen">
        <h1 style="color:#0ff; font-size:50px; margin-bottom:10px;">PAUSE</h1>
        <p style="color:#fff; font-size:20px;">[Esc] or [Z] to Resume</p>
    </div>

    <!-- 被弾（ゲームオーバー）画面 -->
    <div id="gameover-screen" class="overlay-screen">
        <h1 style="color:#f33; font-size:40px; margin-bottom:10px;">GAME OVER</h1>
        <p style="color:#fff; font-size:18px;">被弾しました！</p>
        <p style="color:#ff0; font-size:20px; margin-top:10px;">SCORE: <span id="final-score">0</span></p>
        <p style="color:#aaa; font-size:14px; margin-top:5px;">[R] または [Z] キーでもリトライできます</p>
        <button class="dialog-btn" onclick="resetGame()">RETRY</button>
    </div>

    <!-- クリア画面 -->
    <div id="win-screen" class="overlay-screen">
        <h1 style="color:#0ff; font-size:40px; margin-bottom:10px;">STAGE CLEAR!</h1>
        <p style="color:#fff; font-size:18px;">神の領域の回避力です！</p>
        <p style="color:#ff0; font-size:20px; margin-top:10px;">FINAL SCORE: <span id="win-score">0</span></p>
        <p style="color:#aaa; font-size:14px; margin-top:5px;">[R] または [Z] キーでもリトライできます</p>
        <button class="dialog-btn" onclick="resetGame()">PLAY AGAIN</button>
    </div>

    <canvas id="gameCanvas" width="450" height="600"></canvas>
</div>

<script>
// --- 自作WAV BGMの読み込み ---
const bgmAudio = new Audio('haikei.wav');
bgmAudio.loop = true;
bgmAudio.volume = 0.5;

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
canvas.width = 450;
canvas.height = 600;

// --- ゲーム設定 ---
let stage = 51;
let score = 0;
let frames = 0;
let isGameOver = false;
let isTransitioning = false;
let isPaused = false;
let gameStarted = false;

const keys = {};

// ゲーム開始処理用の共通関数
function startGame() {
    if (!gameStarted) {
        gameStarted = true;
        isPaused = false;
        bgmAudio.play().catch(e => console.log("BGM play failed:", e));
        requestAnimationFrame(loop);
    }
}

window.addEventListener('keydown', (e) => {
    if (e.code === 'F11') {
        e.preventDefault();
        toggleFullscreen();
    }

    if (e.code === 'KeyR') {
        e.preventDefault();
        resetGame();
        return;
    }

    if (isGameOver && (e.code === 'KeyZ' || e.code === 'KeyY')) {
        e.preventDefault();
        resetGame();
        return;
    }

    if (e.code === 'Escape' && gameStarted && !isGameOver) {
        e.preventDefault();
        togglePause();
        return;
    }

    if (isPaused && (e.code === 'KeyZ' || e.code === 'KeyY')) {
        e.preventDefault();
        togglePause();
        return;
    }

    if (!gameStarted && (e.code === 'KeyZ' || e.code === 'KeyY')) {
        startGame();
        return;
    }

    if (!isPaused && !isGameOver) {
        keys[e.code] = true;
    }
}, true);

window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
}, true);

function togglePause() {
    isPaused = !isPaused;
    const pauseScreen = document.getElementById("pause-screen");
    pauseScreen.style.display = isPaused ? 'flex' : 'none';

    if (isPaused) {
        bgmAudio.pause();
    } else {
        bgmAudio.play().catch(e => {});
        requestAnimationFrame(loop);
    }
}

function loop() {
    if (!isGameOver && !isPaused && gameStarted) {
        update();
        draw();
        requestAnimationFrame(loop);
    }
}

function toggleFullscreen() {
    const container = document.getElementById("game-container");
    if (!document.fullscreenElement) {
        container.requestFullscreen().catch(err => {
            console.log(`全画面表示のエラー: ${err.message}`);
        });
    } else {
        document.exitFullscreen();
    }
}

// --- 3D背景（石造り回廊風パース） ---
const focalLength = 220;
const fovCenterX = canvas.width / 2;
const fovCenterY = canvas.height / 2;
const maxZ = 1000;

const pillars3D = [];
for (let i = 0; i < 12; i++) {
    pillars3D.push({ z: (i / 12) * maxZ, width: 140 });
}

const snowParticles = [];
for (let i = 0; i < 60; i++) {
    snowParticles.push({
        x: (Math.random() - 0.5) * 600,
        y: (Math.random() - 0.5) * 600,
        z: Math.random() * maxZ,
        size: 2 + Math.random() * 2.5
    });
}

// --- オブジェクト ---
const player = {
    x: 225, y: 520, 
    startX: 225, startY: 520,
    r: 2, visualR: 8, speed: 4.5,
    reset() {
        this.x = this.startX;
        this.y = this.startY;
    },
    draw() {
        ctx.fillStyle = "#0df";
        ctx.beginPath(); ctx.arc(this.x, this.y, this.visualR, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
    },
    update() {
        let s = keys['ShiftLeft'] ? this.speed / 4.0 : this.speed;
        if (keys['ArrowUp'] && this.y > 20) this.y -= s;
        if (keys['ArrowDown'] && this.y < canvas.height - 20) this.y += s;
        if (keys['ArrowLeft'] && this.x > 20) this.x -= s;
        if (keys['ArrowRight'] && this.x < canvas.width - 20) this.x += s;
    }
};

const boss = {
    x: 225, y: -100, targetY: 100, r: 32, 
    hp: 500, maxHp: 500, phase: 1,
    reset() {
        this.x = 225;
        this.y = -100;
        this.phase = 1;
        this.maxHp = 500;
        this.hp = 500;
        document.getElementById("boss-hp-label").innerText = "BOSS HP";
    },
    update() {
        if (frames >= 600) {
            if (this.phase === 1) {
                if (this.y < this.targetY) this.y += 2;
                else {
                    this.x = 225 + Math.sin(frames * 0.015) * 90;
                    this.y = 100 + Math.cos(frames * 0.02) * 20;
                }
            } else if (this.phase === 2) {
                // フェーズ2は完全に動かず中央固定
                this.x = 225;
                this.y = 100;
            }
        }
    },
    draw() {
        if (this.y > 0) {
            ctx.save();
            
            let baseColor = (this.phase === 1) ? "255, 0, 255" : "0, 255, 255";
            let strokeHex = (this.phase === 1) ? "#ff55ff" : "#55ffff";

            // 1. 強烈なグロー（発光）エフェクト
            ctx.shadowBlur = 25;
            ctx.shadowColor = strokeHex;

            // --- 2. ボスの周囲に浮かぶ魔法陣 ---
            ctx.save();
            ctx.translate(this.x, this.y);
            
            let magicCircleR = this.r * 2.0;

            ctx.rotate(frames * 0.01);
            ctx.strokeStyle = `rgba(${baseColor}, 0.22)`;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 0, magicCircleR, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                let angle = (Math.PI / 3) * i;
                let px = Math.cos(angle) * magicCircleR;
                let py = Math.sin(angle) * magicCircleR;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.stroke();

            ctx.rotate(-frames * 0.02);
            ctx.strokeStyle = `rgba(${baseColor}, 0.18)`;
            ctx.beginPath();
            ctx.arc(0, 0, magicCircleR * 0.8, 0, Math.PI * 2);
            ctx.stroke();

            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.arc(0, 0, magicCircleR * 0.9, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.restore();

            // 3. ボス本体の描画（フェーズ2では肌の色を黒色に設定）
            if (this.phase === 2) {
                ctx.fillStyle = "#000000"; // 肌の色：黒
                ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();

                ctx.strokeStyle = strokeHex; 
                ctx.lineWidth = 4;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.stroke();
            } else {
                ctx.fillStyle = "#330033";
                ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();

                ctx.strokeStyle = strokeHex; 
                ctx.lineWidth = 4;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.stroke();
            }

            // --- 4. フェーズ2限定：ドット絵表情（目と口の色：黄色） ---
            if (this.phase === 2) {
                ctx.save();
                const p = 3; // ドットの1マスのサイズ
                ctx.fillStyle = "#ffcc00"; // 目と口の色：黄色

                // 縦長の楕円ドット目（左目）
                ctx.fillRect(this.x - 11, this.y - 15, p * 2, p * 4);

                // 縦長の楕円ドット目（右目）
                ctx.fillRect(this.x + 5, this.y - 15, p * 2, p * 4);

                // への字口（曲がった口のドット再現）
                ctx.fillRect(this.x - 12, this.y + 11, p * 2, p);
                ctx.fillRect(this.x - 8,  this.y + 8,  p * 2, p);
                ctx.fillRect(this.x - 3,  this.y + 6,  p * 2, p);
                ctx.fillRect(this.x + 2,  this.y + 6,  p * 2, p);
                ctx.fillRect(this.x + 6,  this.y + 8,  p * 2, p);
                ctx.fillRect(this.x + 9,  this.y + 11, p * 2, p * 2);

                ctx.restore();
            }

            // 5. 脈動するオーラリング
            let auraScale = this.r + 8 + Math.sin(frames * 0.1) * 5;
            ctx.strokeStyle = `rgba(${baseColor}, 0.35)`;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(this.x, this.y, auraScale, 0, Math.PI*2); ctx.stroke();

            ctx.restore();
        }
    }
};

let eBullets = [];
let pBullets = [];
let mobs = [];

class Bullet {
    constructor(x, y, vx, vy, color, r, isPhase1 = false, isSpecialStop = false, turnDir = 1) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.color = color; this.r = r;
        this.origVx = vx;
        this.origVy = vy;
        this.isPhase1 = isPhase1;
        this.isSpecialStop = isSpecialStop;
        this.turnDir = turnDir; // 1（右向き）または -1（左向き）
        this.state = 'MOVING';
        this.stopTargetY = y + 150;
        this.timer = 0;
    }
    
    update() {
        if (this.isSpecialStop) {
            if (this.state === 'MOVING') {
                this.x += this.vx;
                this.y += this.vy;
                // 自機のすぐ直前ギリギリ（Y=518付近）で一斉にピタッと停止
                if (this.y >= 518) {
                    this.vx = 0;
                    this.vy = 0;
                    this.state = 'STOPPED';
                }
            } else if (this.state === 'STOPPED') {
                this.timer++;
                if (this.timer > 35) { 
                    let baseAngle = Math.atan2(this.origVy, this.origVx);
                    // 右向き・左向きを交互に約7.5度振る
                    let angleOffset = this.turnDir * (7.5 * Math.PI / 180);
                    let finalAngle = baseAngle + angleOffset;
                    let slowSpeed = 0.9;
                    this.vx = Math.cos(finalAngle) * slowSpeed;
                    this.vy = Math.sin(finalAngle) * slowSpeed;
                    this.state = 'AGAIN';
                }
            } else if (this.state === 'AGAIN') {
                this.x += this.vx;
                this.y += this.vy;
            }
        } else if (this.isPhase1) {
            let gravityFactor = Math.max(0.3, this.y / 250);

            if (this.state === 'MOVING') {
                this.x += this.vx * gravityFactor;
                this.y += this.vy * gravityFactor;

                if (this.y >= this.stopTargetY - 15 && this.y <= this.stopTargetY + 15) {
                    this.vx = 0;
                    this.vy = 0;
                    this.state = 'STOPPED';
                }
            } 
            else if (this.state === 'STOPPED') {
                this.timer++;
                if (this.timer > 30) {
                    let angle = Math.atan2(player.y - this.y, player.x - this.x);
                    let speed = 5.0;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.state = 'AGAIN';
                }
            } 
            else if (this.state === 'AGAIN') {
                this.x += this.vx * gravityFactor;
                this.y += this.vy * gravityFactor;
            }
        } 
        else {
            let gravityFactor = Math.max(0.3, this.y / 250);
            this.x += this.vx * gravityFactor;
            this.y += this.vy * gravityFactor;
        }
    }

    draw() {
        ctx.fillStyle = (this.isPhase1 && this.state === 'STOPPED') ? '#ffff00' : this.color;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
    }
}

// --- 弾幕＆雑魚ウェーブ定義 ---
function shoot() {
    if (isTransitioning) return;
    const f = frames;

    if (f < 600) {
        if (f % 0.625 === 0) { 
            const count = 160; 
            
            for (let i = 0; i < count; i++) {
                let mobX = -30 - i * 14;
                let mobY = 40 + (i * 2.5);
                mobs.push({
                    x: mobX,
                    y: mobY,
                    vx: 6.5,
                    vy: 0.8,
                    hasShot: false
                });
            }

            for (let i = 0; i < count; i++) {
                let mobX = canvas.width + 30 + i * 14;
                let mobY = 40 + (i * 2.5);
                mobs.push({
                    x: mobX,
                    y: mobY,
                    vx: -6.5,
                    vy: 0.8,
                    hasShot: false
                });
            }
        }
    }

    mobs.forEach((m) => {
        m.x += m.vx;
        m.y += m.vy;

        if (!m.hasShot && m.x > 10 && m.x < canvas.width - 10) {
            m.hasShot = true;
            let angle = Math.atan2(player.y - m.y, player.x - m.x);
            let speed = 4.2;
            eBullets.push(new Bullet(
                m.x, m.y,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                "#88ccff", 3.5,
                true
            ));
        }
    });

    mobs = mobs.filter(m => m.x > -600 && m.x < canvas.width + 600 && m.y < canvas.height + 100);

    if (f >= 600) {
        const b = boss;
        if (b.y >= b.targetY) {
            if (b.phase === 1) {
                if (f % 10 === 0) {
                    createRing(b.x, b.y, f * 0.08, 2.5, "#ff55ff", 3.5, 24, false);
                    createRing(b.x, b.y, -f * 0.06, 2.0, "#55ffff", 3.5, 24, false);
                }
                if (f % 4 === 0) {
                    let randomAngle = Math.random() * Math.PI * 2;
                    let speed = 2.0 + Math.random() * 1.5;
                    eBullets.push(new Bullet(b.x, b.y, Math.cos(randomAngle) * speed, Math.sin(randomAngle) * speed, "#ffffff", 3, false));
                }
            } else if (b.phase === 2) {
                // ボスフェーズ2：約3秒間（150フレーム）発射、0.75秒間（45フレーム）休憩のサイクル
                let cycleFrame = f % 195; // 全体195フレーム（約3.25秒）周期
                if (cycleFrame < 150) { // 最初の150フレーム（2.5秒〜3秒）は発射
                    if (f % 3 === 0) {
                        let baseAngle = f * 0.04;
                        createStopRing(b.x, b.y, baseAngle, 4.4, "#ff33aa", 2.8, 32, true);
                    }
                }
                // 150〜194フレーム（0.75秒間）は何も射出せず休憩
            }
        }
    }
}

function createRing(x, y, startAngle, speed, color, r, count, isPhase1) {
    for (let i = 0; i < count; i++) {
        const angle = startAngle + (Math.PI * 2 / count) * i;
        eBullets.push(new Bullet(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, color, r, isPhase1, false));
    }
}

function createStopRing(x, y, startAngle, speed, color, r, count, isSpecialStop) {
    for (let i = 0; i < count; i++) {
        const angle = startAngle + (Math.PI * 2 / count) * i;
        // 弾ごとに右向き(+1)と左向き(-1)を交互に割り当てる
        const turnDir = (i % 2 === 0) ? 1 : -1;
        eBullets.push(new Bullet(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, color, r, false, isSpecialStop, turnDir));
    }
}

// --- メインループ ---
function update() {
    if (isGameOver || isPaused) return;
    frames++;
    player.update();
    boss.update();
    shoot();

    // 自機弾の発射
    if (keys['KeyZ'] && frames % 5 === 0) {
        pBullets.push({
            x: player.x,
            y: player.y - 10,
            vx: 0,
            vy: -14,
            r: 3,
            color: "#ffffff",
            update() {
                this.x += this.vx;
                this.y += this.vy;
            },
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fill();
            }
        });
    }

    // 自機弾の更新とボスへのヒット判定
    pBullets.forEach((pb, i) => {
        pb.update();
        if (boss.y > 0 && Math.hypot(pb.x - boss.x, pb.y - boss.y) < boss.r + pb.r) {
            boss.hp -= 10;
            pBullets.splice(i, 1);
            score += 10;
        }
        if (pb.y < 0) {
            pBullets.splice(i, 1);
        }
    });

    // ボス本体との接触判定
    if (boss.y > 0 && Math.hypot(boss.x - player.x, boss.y - player.y) < boss.r + player.r) {
        gameOver();
    }

    // 敵弾との接触判定
    eBullets.forEach((eb, i) => {
        eb.update();

        if (Math.hypot(eb.x - player.x, eb.y - player.y) < eb.r + player.r) {
            gameOver();
        }

        if (eb.x < -40 || eb.x > canvas.width + 40 || eb.y < -40 || eb.y > canvas.height + 40) {
            eBullets.splice(i, 1);
        }
    });

    document.getElementById("hp-bar-fill").style.width = Math.max(0, (boss.hp / boss.maxHp * 100)) + "%";
    document.getElementById("score-val").innerText = score;

    // ボスのフェーズ移行およびクリア判定
    if (boss.hp <= 0 && !isTransitioning) {
        if (boss.phase === 1) {
            boss.phase = 2;
            boss.maxHp = 6000;
            boss.hp = 6000;
            document.getElementById("boss-hp-label").innerText = "BOSS HP (Phase 2)";
            eBullets = [];
        } else {
            win();
        }
    }
}

function gameOver() {
    isGameOver = true;
    bgmAudio.pause();
    document.getElementById("final-score").innerText = score;
    document.getElementById("gameover-screen").style.display = 'flex';
}

function win() {
    isGameOver = true;
    bgmAudio.pause();
    document.getElementById("win-score").innerText = score;
    document.getElementById("win-screen").style.display = 'flex';
}

function resetGame() {
    isGameOver = false;
    isPaused = false;
    frames = 0;
    score = 0;
    eBullets = [];
    pBullets = [];
    mobs = [];
    
    player.reset();
    boss.reset();

    document.getElementById("gameover-screen").style.display = 'none';
    document.getElementById("win-screen").style.display = 'none';
    document.getElementById("pause-screen").style.display = 'none';

    bgmAudio.currentTime = 0;
    bgmAudio.play().catch(e => {});
    
    requestAnimationFrame(loop);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // --- 背景描画 ---
    const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    bgGrad.addColorStop(0, '#1c1b22');
    bgGrad.addColorStop(0.5, '#2c2a35');
    bgGrad.addColorStop(1, '#0f0e14');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const speedZ = 6;

    pillars3D.sort((a, b) => b.z - a.z);
    pillars3D.forEach(p => {
        p.z -= speedZ;
        if (p.z <= 10) p.z += maxZ;

        const scale = focalLength / p.z;
        const projWidth = p.width * scale;
        const alpha = Math.min(1, Math.max(0, (maxZ - p.z) / 400));

        const leftX2D = fovCenterX + (-170 * scale);
        const rightX2D = fovCenterX + (170 * scale);

        ctx.fillStyle = `rgba(60, 58, 70, ${alpha})`;
        ctx.fillRect(leftX2D - projWidth / 2, 0, projWidth, canvas.height);
        ctx.strokeStyle = `rgba(90, 85, 100, ${alpha})`;
        ctx.lineWidth = Math.max(1, 3 * scale);
        ctx.strokeRect(leftX2D - projWidth / 2, 0, projWidth, canvas.height);

        ctx.fillStyle = `rgba(60, 58, 70, ${alpha})`;
        ctx.fillRect(rightX2D - projWidth / 2, 0, projWidth, canvas.height);
        ctx.strokeStyle = `rgba(90, 85, 100, ${alpha})`;
        ctx.strokeRect(rightX2D - projWidth / 2, 0, projWidth, canvas.height);
    });

    snowParticles.forEach(sp => {
        sp.z -= speedZ * 0.8;
        if (sp.z <= 10) sp.z += maxZ;

        const scale = focalLength / sp.z;
        const projX = fovCenterX + (sp.x * scale);
        const projY = fovCenterY + (sp.y * scale) + (frames * 0.5) % canvas.height;
        let wrappedY = projY % canvas.height;
        if (wrappedY < 0) wrappedY += canvas.height;

        const projSize = Math.max(1, sp.size * scale);
        const alpha = Math.min(0.8, (maxZ - sp.z) / 300);

        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.beginPath();
        ctx.arc(projX, wrappedY, projSize, 0, Math.PI * 2);
        ctx.fill();
    });

    mobs.forEach(m => {
        ctx.fillStyle = "#00ffff";
        ctx.beginPath(); ctx.arc(m.x, m.y, 8, 0, Math.PI*2); ctx.fill();
    });

    // --- オブジェクト描画 ---
    player.draw();
    boss.draw();
    pBullets.forEach(b => b.draw());
    eBullets.forEach(b => b.draw());
}

// 初期画面メッセージ描画
function renderTitle() {
    ctx.fillStyle = '#fff'; ctx.font = '20px Courier New'; ctx.textAlign = 'center';
    ctx.fillText('CLICK OR [Z] TO START', canvas.width / 2, canvas.height / 2 - 10);
    ctx.fillStyle = '#888'; ctx.font = '14px Courier New';
    ctx.fillText('[F11] to Toggle Fullscreen', canvas.width / 2, canvas.height / 2 + 20);
}
renderTitle();

// キャンバス自体の直接クリックでもゲームを開始
canvas.addEventListener('mousedown', () => {
    startGame();
});
</script>
