<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>LastShoot   --NECRO SHOOT--</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', sans-serif; }
        #canvas { display: block; width: 100vw; height: 100vh; background: #000; }
        #fileInput { display: none; }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>
<input type="file" id="fileInput" accept=".json">

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const BASE_WIDTH = 1920;
const BASE_HEIGHT = 1080;
canvas.width = BASE_WIDTH;
canvas.height = BASE_HEIGHT;

const GAME_X = 150;
const GAME_Y = 50;
const GAME_WIDTH = 1100;
const GAME_HEIGHT = 980;

// ----------------------------------------------------
// オーディオシステム
// ----------------------------------------------------
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let bgmInterval = null;

function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
}

function playSE(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    
    if (type === 'shoot') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(900, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
        gain.gain.setValueAtTime(0.04, now);
    } else if (type === 'pichu') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(500, now);
        osc.frequency.linearRampToValueAtTime(60, now + 0.35);
        gain.gain.setValueAtTime(0.3, now);
    } else if (type === 'bomb') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(950, now + 1.8);
        gain.gain.setValueAtTime(0.4, now);
    }
    gain.gain.linearRampToValueAtTime(0, now + (type==='bomb'?1.8:0.3));
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + (type==='bomb'?1.8:0.4));
}

function startBGM() {
    if (!audioCtx) return;
    if (bgmInterval) clearInterval(bgmInterval);
    
    let tempo = 180;
    let stepTime = 60 / tempo / 4; 
    let step = 0;
    
    const melody = [
        69, 72, 76, 72, 71, 74, 77, 74, 69, 72, 76, 72, 67, 71, 74, 71,
        69, 72, 76, 72, 71, 74, 77, 74, 79, 76, 74, 72, 71, 69, 67, 64
    ];
    const bass = [
        45, 45, 45, 45, 48, 48, 48, 48, 43, 43, 43, 43, 40, 40, 40, 40
    ];

    bgmInterval = setInterval(() => {
        if (gameState !== 'PLAY' && !isReplaying) return;
        let now = audioCtx.currentTime;
        
        if (step % 4 === 0) {
            let osc = audioCtx.createOscillator();
            let g = audioCtx.createGain();
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.exponentialRampToValueAtTime(45, now + 0.08);
            g.gain.setValueAtTime(0.25, now);
            g.gain.linearRampToValueAtTime(0, now + 0.08);
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.08);
        }
        
        let mNote = melody[step % melody.length];
        let mFreq = 440 * Math.pow(2, (mNote - 69) / 12);
        let mOsc = audioCtx.createOscillator();
        let mGain = audioCtx.createGain();
        mOsc.type = 'sawtooth';
        mOsc.frequency.setValueAtTime(mFreq, now);
        mGain.gain.setValueAtTime(0.05, now);
        mGain.gain.linearRampToValueAtTime(0, now + stepTime * 0.9);
        mOsc.connect(mGain); mGain.connect(audioCtx.destination);
        mOsc.start(now); mOsc.stop(now + stepTime);

        let bNote = bass[Math.floor(step / 2) % bass.length];
        let bFreq = 440 * Math.pow(2, (bNote - 69) / 12);
        let bOsc = audioCtx.createOscillator();
        let bGain = audioCtx.createGain();
        bOsc.type = 'triangle';
        bOsc.frequency.setValueAtTime(bFreq, now);
        bGain.gain.setValueAtTime(0.08, now);
        bGain.gain.linearRampToValueAtTime(0, now + stepTime * 1.8);
        bOsc.connect(bGain); bGain.connect(audioCtx.destination);
        bOsc.start(now); bOsc.stop(now + stepTime * 2);

        step++;
    }, stepTime * 1000);
}

function stopBGM() {
    if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
}

// ----------------------------------------------------
// 操作設定 & パッド専用キーコンフィグシステム
// ----------------------------------------------------
// キーボードの設定は固定値とし、キーコンフィグの変更を受け付けないように修正
const controls = {
    keyboard: { shoot: 'z', bomb: 'x', slow: 'Shift', pause: 'Escape', fast: 'Control' },
    gamepad: { shoot: 0, bomb: 1, slow: 2, pause: 9, fast: 5 } 
};

let keyStates = {};
let padStates = {};

let configTarget = null; 
let configMode = false;  
let configStep = 0;      

const CONFIG_STEPS = [
    { target: 'shoot', name: 'ショットボタン' },
    { target: 'bomb', name: 'ボムボタン' },
    { target: 'slow', name: '低速移動ボタン' },
    { target: 'pause', name: '一時停止ボタン' },
    { target: 'fast', name: 'リプレイ倍速(早送り)ボタン' }
];

function startKeyConfig() {
    initAudio();
    configMode = true;
    configStep = 0;
    nextConfigStep();
}

function nextConfigStep() {
    if (configStep < CONFIG_STEPS.length) {
        configTarget = CONFIG_STEPS[configStep].target;
    } else {
        configTarget = null;
        configMode = false;
        configStep = 0;
        alert("コントローラーのボタン設定が正常に保存されました！");
    }
}

window.addEventListener('keydown', (e) => {
    keyStates[e.key] = true;
    
    // 【修正】キーコンフィグモード中であっても、キーボードの入力による割り当て変更は無視する
    if (configMode && configTarget) {
        if (e.key === 'Escape') { // Escapeが押された場合のみキャンセル処理を行う
            configMode = false;
            configTarget = null;
        }
        e.preventDefault();
        return;
    }
    
    if (gameState === 'PLAY' && e.key === controls.keyboard.pause) {
        triggerPause();
    }
});

window.addEventListener('keyup', (e) => { keyStates[e.key] = false; });

function updateGamepad() {
    const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
    let pad = gamepads[0];
    if (pad) {
        padStates.up = pad.axes[1] < -0.3 || pad.buttons[12].pressed;
        padStates.down = pad.axes[1] > 0.3 || pad.buttons[13].pressed;
        padStates.left = pad.axes[0] < -0.3 || pad.buttons[14].pressed;
        padStates.right = pad.axes[0] > 0.3 || pad.buttons[15].pressed;
        
        padStates.shoot = pad.buttons[controls.gamepad.shoot]?.pressed;
        padStates.bomb = pad.buttons[controls.gamepad.bomb]?.pressed;
        padStates.slow = pad.buttons[controls.gamepad.slow]?.pressed;
        padStates.fast = pad.buttons[controls.gamepad.fast]?.pressed; 
        
        if (pad.buttons[controls.gamepad.pause]?.pressed) {
            if (!padStates.pausePressed) {
                if (gameState === 'PLAY') triggerPause();
                padStates.pausePressed = true;
            }
        } else {
            padStates.pausePressed = false;
        }

        // コントローラーの入力のみキーコンフィグに反映
        if (configMode && configTarget) {
            for (let i = 0; i < pad.buttons.length; i++) {
                if (pad.buttons[i].pressed) {
                    controls.gamepad[configTarget] = i;
                    configTarget = null; 
                    setTimeout(() => {
                        configStep++;
                        nextConfigStep();
                    }, 300);
                    break;
                }
            }
        }
    } else {
        padStates = {};
    }
}

// ----------------------------------------------------
// ゲーム基本パラメータ群
// ----------------------------------------------------
let gameState = 'TITLE'; 
let score = 0;
let power = 100;
let stage = 1; 
let isLastShootUnlocked = true; 

let replayData = { stage: 1, inputs: [] };
let currentFrame = 0;
let isReplaying = false;
let replaySpeed = 1; 

let player = { x: 0, y: 0, speed: 8, slowSpeed: 3.5, size: 4, hitSize: 2, bombs: 3, lives: 3, invuln: 0 };
let boss = { x: 0, y: 0, maxHp: 600, hp: 600, maxSpell: 3, currentSpell: 0, active: false };
let bullets = [];
let enemyBullets = [];
let enemies = [];
let items = [];
let stars = []; 
let effects = []; 
let prevBombInput = false;

function initStars() {
    stars = [];
    for (let i = 0; i < 200; i++) {
        stars.push({
            x: Math.random() * GAME_WIDTH,
            y: Math.random() * GAME_HEIGHT,
            speed: Math.random() * 18 + 12, 
            size: Math.random() * 2 + 1,
            color: `rgba(${Math.floor(Math.random()*55+200)}, ${Math.floor(Math.random()*55+200)}, 255, ${Math.random()*0.8+0.2})`
        });
    }
}

function initGame(selectedStage) {
    isReplaying = false;
    replaySpeed = 1;
    configMode = false;

    initAudio();
    startBGM();
    stage = selectedStage;
    if (stage === 1) {
        score = 0;
        power = 100;
        isLastShootUnlocked = true; 
    }
    currentFrame = 0;
    
    player.x = GAME_WIDTH / 2;
    player.y = GAME_HEIGHT * 0.8;
    player.bombs = 3;
    if (stage === 1) player.lives = 3;
    player.invuln = 60;
    
    boss.x = GAME_WIDTH / 2;
    boss.y = 180;
    boss.maxHp = stage === 1 ? 500 : 1800; 
    boss.hp = boss.maxHp;
    boss.currentSpell = 0;
    boss.active = true;
    
    bullets = [];
    enemyBullets = [];
    enemies = [];
    items = [];
    effects = [];
    
    replayData = { stage: stage, inputs: [] };
    initStars();
    gameState = 'PLAY';
}

function startReplayGame() {
    initAudio();
    startBGM();
    stage = replayData.stage || 1;
    currentFrame = 0;
    score = 0;
    power = 100;
    configMode = false;
    
    player.x = GAME_WIDTH / 2;
    player.y = GAME_HEIGHT * 0.8;
    player.bombs = 3;
    player.lives = 3;
    player.invuln = 60;
    
    boss.x = GAME_WIDTH / 2;
    boss.y = 180;
    boss.maxHp = stage === 1 ? 500 : 1800;
    boss.hp = boss.maxHp;
    boss.currentSpell = 0;
    boss.active = true;
    
    bullets = [];
    enemyBullets = [];
    enemies = [];
    items = [];
    effects = [];
    
    initStars();
    gameState = 'PLAY';
}

// 1ステージ目限定：四重結界同期ライン弾幕
let firstStageTimer = 0;
function updateFirstStagePattern() {
    firstStageTimer++;
    let cycle = firstStageTimer % 210; 
    
    if (cycle < 120) {
        let dY1 = 160;  
        let dY2 = 320;  
        let dY3 = -80;  
        let dY4 = -160; 
        
        let linesY = [player.y - dY1, player.y - dY2, player.y - dY3, player.y - dY4];
        
        linesY.forEach((lineY, lineIndex) => {
            let spacing = 75; 
            for (let emitterX = 0; emitterX <= GAME_WIDTH; emitterX += spacing) {
                let angle = Math.atan2(player.y - lineY, player.x - emitterX);
                enemyBullets.push({
                    x: emitterX,
                    y: lineY,
                    vx: Math.cos(angle) * 9,
                    vy: Math.sin(angle) * 9,
                    size: 5.5,
                    color: lineIndex < 2 ? '#aaffcc' : '#ffffff' 
                });
            }
        });
    }
}

// 2ステージ目 [Last Shoot] 極限弾幕
let lastShootTimer = 0;
function updateLastShootPattern() {
    lastShootTimer++;
    if (lastShootTimer % 2 === 0) {
        let count = 16;
        let baseAngle = (lastShootTimer * 0.08);
        for(let i=0; i<count; i++) {
            let angle = baseAngle + (i * (Math.PI * 2 / count));
            enemyBullets.push({
                x: boss.x, y: boss.y,
                vx: Math.cos(angle) * 6.5, vy: Math.sin(angle) * 6.5,
                size: 7, color: '#ff1177'
            });
        }
    }
    if (lastShootTimer % 10 === 0) {
        let a = Math.atan2(player.y - boss.y, player.x - boss.x);
        for(let i = -6; i <= 6; i++) {
            let angle = a + (i * 0.11);
            enemyBullets.push({
                x: boss.x, y: boss.y,
                vx: Math.cos(angle) * 13, vy: Math.sin(angle) * 13,
                size: 6, color: '#ffee00'
            });
        }
    }
}

function updateBossSpells() {
    if (stage === 2) {
        updateLastShootPattern();
        return;
    }
    
    let diff = boss.currentSpell * 0.6; 
    
    if (boss.currentSpell === 0) {
        updateFirstStagePattern(); 
    } else if (boss.currentSpell === 1) {
        if (currentFrame % 4 === 0) {
            let angle = (currentFrame * 0.06);
            for(let i=0; i<8; i++){
                let a = angle + (i * Math.PI * 2 / 8);
                enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a)*(5+diff), vy: Math.sin(a)*(5+diff), size: 6, color: '#00ffff' });
            }
        }
    } else if (boss.currentSpell === 2) {
        if (currentFrame % 6 === 0) {
            for (let i = 0; i < 18; i++) {
                let a = (i * Math.PI * 2 / 18) + Math.sin(currentFrame*0.03);
                enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a)*5.5, vy: Math.sin(a)*5.5, size: 5, color: '#ff9900' });
            }
        }
    } else if (boss.currentSpell === 3) {
        if (currentFrame % 3 === 0) {
            let a = Math.random()*Math.PI*2;
            enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a)*4.5, vy: Math.sin(a)*4.5, size: 6, color: '#ff3333' });
        }
        if (currentFrame % 12 === 0) {
            let a = Math.atan2(player.y - boss.y, player.x - boss.x);
            for(let i=-3; i<=3; i++) {
                enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a+i*0.13)*8.5, vy: Math.sin(a+i*0.13)*8.5, size: 6, color: '#ffffff' });
            }
        }
    }
}

// ----------------------------------------------------
// メイン更新ループ
// ----------------------------------------------------
function updateGame() {
    currentFrame++;
    
    let currentInput = {};
    if (isReplaying) {
        currentInput = replayData.inputs[currentFrame] || {};
        replaySpeed = (keyStates[controls.keyboard.fast] || padStates.fast) ? 2 : 1;
    } else {
        updateGamepad();
        currentInput = {
            up: keyStates['ArrowUp'] || padStates.up,
            down: keyStates['ArrowDown'] || padStates.down,
            left: keyStates['ArrowLeft'] || padStates.left,
            right: keyStates['ArrowRight'] || padStates.right,
            shoot: keyStates[controls.keyboard.shoot] || padStates.shoot,
            bomb: keyStates[controls.keyboard.bomb] || padStates.bomb,
            slow: keyStates[controls.keyboard.slow] || padStates.slow
        };
        replayData.inputs[currentFrame] = currentInput;
    }
    
    stars.forEach(s => {
        s.y += s.speed;
        if (s.y > GAME_HEIGHT) { s.y = 0; s.x = Math.random() * GAME_WIDTH; }
    });
    
    if (player.invuln > 0) player.invuln--;
    
    effects = effects.filter(eff => {
        if (eff.type === 'bomb') {
            eff.timer--;
            if (boss.active && boss.hp > 0) boss.hp -= 4.5; 
            enemyBullets.forEach(b => items.push({ x: b.x, y: b.y, type: 'score', vy: 3 }));
            enemyBullets = [];
            return eff.timer > 0;
        }
        return true;
    });
    
    let speed = currentInput.slow ? player.slowSpeed : player.speed;
    if (currentInput.up) player.y -= speed;
    if (currentInput.down) player.y += speed;
    if (currentInput.left) player.x -= speed;
    if (currentInput.right) player.x += speed;
    
    player.x = Math.max(10, Math.min(GAME_WIDTH - 10, player.x));
    player.y = Math.max(10, Math.min(GAME_HEIGHT - 10, player.y));
    
    if (currentInput.shoot && currentFrame % 4 === 0) {
        playSE('shoot');
        bullets.push({ x: player.x - 15, y: player.y - 20, vy: -25 });
        bullets.push({ x: player.x + 15, y: player.y - 20, vy: -25 });
    }
    
    if (currentInput.bomb && !prevBombInput && player.bombs > 0 && !effects.some(e=>e.type==='bomb')) {
        playSE('bomb');
        player.bombs--;
        isLastShootUnlocked = false; 
        effects.push({ type: 'bomb', timer: 120 });
    }
    prevBombInput = currentInput.bomb;
    
    if (stage === 1 && currentFrame % 95 === 0 && boss.currentSpell === 0) {
        enemies.push({ x: Math.random() * (GAME_WIDTH - 200) + 100, y: -30, timer: 0, hp: 5 });
    }
    enemies.forEach(e => {
        e.timer++;
        e.y += 3.8;
        e.x += Math.sin(e.timer * 0.05) * 6.5; 
        
        if (e.timer % 18 === 0) {
            for (let i = -1; i <= 1; i++) {
                let angle = Math.atan2(player.y - e.y, player.x - e.x) + i * 0.28;
                enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(angle)*4.5, vy: Math.sin(angle)*4.5, size: 5, color: '#99bbff' });
            }
        }
    });
    enemies = enemies.filter(e => e.y < GAME_HEIGHT + 40 && e.hp > 0);
    
    if (boss.active) {
        updateBossSpells();
        if (boss.hp <= 0) {
            if (stage === 1 && boss.currentSpell < boss.maxSpell) {
                boss.currentSpell++; 
                boss.hp = boss.maxHp;
                enemyBullets = []; 
            } else {
                boss.active = false;
                if (stage === 1 && isLastShootUnlocked) {
                    initGame(2); 
                } else {
                    gameState = 'CLEAR';
                    stopBGM();
                }
            }
        }
    }
    
    bullets.forEach(b => {
        b.y += b.vy;
        enemies.forEach(e => {
            if (Math.hypot(b.x - e.x, b.y - e.y) < 30) {
                e.hp--; b.toRemove = true; score += 20;
                if (e.hp <= 0) items.push({ x: e.x, y: e.y, type: '1up', vy: 2.5 }); 
            }
        });
        if (boss.active && Math.hypot(b.x - boss.x, b.y - boss.y) < 65) {
            boss.hp -= 2.2; b.toRemove = true; score += 10;
            if (currentFrame % 5 === 0) {
                items.push({ x: boss.x + (Math.random()*200-100), y: 0, type: Math.random()>0.5?'score':'power', vy: 5 });
            }
        }
    });
    bullets = bullets.filter(b => b.y > -20 && !b.toRemove);
    
    enemyBullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
    enemyBullets = enemyBullets.filter(b => b.x > -30 && b.x < GAME_WIDTH + 30 && b.y > -30 && b.y < GAME_HEIGHT + 30);
    
    items.forEach(item => {
        item.y += item.vy;
        if (player.y < GAME_HEIGHT * 0.35) { 
            let a = Math.atan2(player.y - item.y, player.x - item.x);
            item.x += Math.cos(a) * 15; item.y += Math.sin(a) * 15;
        }
        if (Math.hypot(player.x - item.x, player.y - item.y) < 45) {
            item.toRemove = true;
            if (item.type === 'score') score += 1000;
            if (item.type === 'power') power = Math.min(400, power + 4);
            if (item.type === '1up') player.lives++;
        }
    });
    items = items.filter(i => i.y < GAME_HEIGHT + 20 && !i.toRemove);
    
    if (player.invuln === 0) {
        for (let b of enemyBullets) {
            if (Math.hypot(player.x - b.x, player.y - b.y) < (player.hitSize + b.size)) { playerHit(); break; }
        }
        for (let e of enemies) {
            if (Math.hypot(player.x - e.x, player.y - e.y) < 28) { playerHit(); break; }
        }
    }
    
    if (isReplaying && currentFrame >= replayData.inputs.length - 1) {
        gameState = 'TITLE'; isReplaying = false; stopBGM();
    }
}

function playerHit() {
    playSE('pichu');
    player.lives--;
    isLastShootUnlocked = false; 
    player.invuln = 130;
    player.x = GAME_WIDTH / 2;
    player.y = GAME_HEIGHT * 0.8;
    enemyBullets = [];
    if (player.lives < 0) { gameState = 'GAMEOVER'; stopBGM(); }
}

// ----------------------------------------------------
// UIメニュー＆インターフェース一覧
// ----------------------------------------------------
let menuIndex = 0;
let titleMenu = ['スタート', 'リプレイを読み込む', 'ボタン割り当て'];
let pauseMenu = ['再開', '最初からやりなおす', 'ボタン割り当て', 'スタート画面に戻る'];
let endMenu = ['最初からやりなおす', 'リプレイを出力', 'スタート画面に戻る'];

function triggerPause() {
    if (gameState === 'PLAY') { gameState = 'PAUSE'; menuIndex = 0; }
}

function handleMenus() {
    updateGamepad();
    let up = keyStates['ArrowUp'] || padStates.up;
    let down = keyStates['ArrowDown'] || padStates.down;
    let enter = keyStates['z'] || keyStates['Enter'] || padStates.shoot;
    
    if (configMode) {
        return; // キーボードでの設定操作は何も受け付けない
    }

    if (gameState === 'TITLE') {
        let maxMenu = titleMenu.length; 
        if (up && !prevUp) menuIndex = (menuIndex - 1 + maxMenu) % maxMenu;
        if (down && !prevDown) menuIndex = (menuIndex + 1) % maxMenu;
        if (enter && !prevEnter) {
            if (menuIndex === 0) initGame(1); 
            if (menuIndex === 1) document.getElementById('fileInput').click(); 
            if (menuIndex === 2) startKeyConfig(); 
        }
    } else if (gameState === 'PAUSE') {
        let maxMenu = pauseMenu.length;
        if (up && !prevUp) menuIndex = (menuIndex - 1 + maxMenu) % maxMenu;
        if (down && !prevDown) menuIndex = (menuIndex + 1) % maxMenu;
        if (enter && !prevEnter) {
            if (menuIndex === 0) gameState = 'PLAY';
            if (menuIndex === 1) initGame(1);
            if (menuIndex === 2) startKeyConfig(); 
            if (menuIndex === 3) { gameState = 'TITLE'; stopBGM(); menuIndex = 0; } 
        }
    } else if (gameState === 'GAMEOVER' || gameState === 'CLEAR') {
        let maxMenu = endMenu.length;
        if (up && !prevUp) menuIndex = (menuIndex - 1 + maxMenu) % maxMenu;
        if (down && !prevDown) menuIndex = (menuIndex + 1) % maxMenu;
        if (enter && !prevEnter) {
            if (menuIndex === 0) initGame(1);
            if (menuIndex === 1) exportReplay();
            if (menuIndex === 2) { gameState = 'TITLE'; stopBGM(); menuIndex = 0; } 
        }
    }
    prevUp = up; prevDown = down; prevEnter = enter;
}
let prevUp = false, prevDown = false, prevEnter = false;

function exportReplay() {
    let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(replayData));
    let dl = document.createElement('a');
    dl.setAttribute("href", dataStr);
    dl.setAttribute("download", `touhou_replay.json`);
    document.body.appendChild(dl); dl.click(); dl.remove();
}

document.getElementById('fileInput').addEventListener('change', function(e) {
    let file = e.target.files[0];
    if (!file) return;
    let reader = new FileReader();
    reader.onload = function(e) {
        try {
            replayData = JSON.parse(e.target.result);
            isReplaying = true; 
            startReplayGame();
        } catch(err) { 
            alert("有効なリプレイファイルではありません。"); 
        } finally {
            document.getElementById('fileInput').value = "";
        }
    };
    reader.readAsText(file);
});

// ----------------------------------------------------
// レンダリング描画
// ----------------------------------------------------
function draw() {
    ctx.clearRect(0, 0, BASE_WIDTH, BASE_HEIGHT);
    ctx.fillStyle = '#0a0518'; ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);
    
    ctx.save();
    ctx.beginPath(); ctx.rect(GAME_X, GAME_Y, GAME_WIDTH, GAME_HEIGHT); ctx.clip();
    ctx.fillStyle = '#02000c'; ctx.fillRect(GAME_X, GAME_Y, GAME_WIDTH, GAME_HEIGHT);
    
    stars.forEach(s => {
        ctx.fillStyle = s.color;
        ctx.fillRect(GAME_X + s.x, GAME_Y + s.y, s.size, s.size * 3.5);
    });
    
    if (['PLAY', 'PAUSE', 'GAMEOVER', 'CLEAR'].includes(gameState)) {
        effects.forEach(eff => {
            if (eff.type === 'bomb') {
                ctx.fillStyle = `rgba(130, 40, 255, ${eff.timer / 120 * 0.45})`;
                ctx.beginPath(); ctx.arc(GAME_X + player.x, GAME_Y + player.y, (120 - eff.timer) * 12, 0, Math.PI*2); ctx.fill();
            }
        });
        
        enemies.forEach(e => {
            ctx.fillStyle = '#ff2255';
            ctx.beginPath(); ctx.arc(GAME_X + e.x, GAME_Y + e.y, 18, 0, Math.PI*2); ctx.fill();
        });
        
        for (let i = 0; i < player.lives; i++) {
            drawStar(GAME_X + 45 + (i * 38), GAME_Y + 45, 5, 12, 5, '#ff44aa');
        }
        
        if (player.invuln % 4 < 2) {
            ctx.fillStyle = '#ff3388'; 
            ctx.beginPath(); ctx.arc(GAME_X + player.x, GAME_Y + player.y, 15, 0, Math.PI*2); ctx.fill();
            if (keyStates[controls.keyboard.slow] || padStates.slow) {
                ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(GAME_X + player.x, GAME_Y + player.y, player.hitSize + 3, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            }
        }
        
        if (boss.active) {
            ctx.fillStyle = '#ee1155';
            ctx.beginPath(); ctx.arc(GAME_X + boss.x, GAME_Y + boss.y, 32, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = `rgba(0, 255, 255, ${0.4 + Math.sin(currentFrame*0.08)*0.2})`; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(GAME_X + boss.x, GAME_Y + boss.y, 65, 0, Math.PI*2); ctx.stroke(); 
            
            ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(GAME_X + 60, GAME_Y + 25, GAME_WIDTH - 120, 10);
            ctx.fillStyle = boss.currentSpell === 0 ? '#00ffaa' : '#ff3344';
            ctx.fillRect(GAME_X + 60, GAME_Y + 25, (GAME_WIDTH - 120) * (boss.hp / boss.maxHp), 10);
        }
        
        ctx.fillStyle = '#88e8ff';
        bullets.forEach(b => ctx.fillRect(GAME_X + b.x - 3, GAME_Y + b.y, 6, 22));
        
        enemyBullets.forEach(b => {
            ctx.fillStyle = b.color;
            ctx.beginPath(); ctx.arc(GAME_X + b.x, GAME_Y + b.y, b.size, 0, Math.PI*2); ctx.fill();
        });
        
        items.forEach(item => {
            ctx.fillStyle = item.type==='score' ? '#2255ff' : (item.type==='power' ? '#ff2222' : '#ffff33');
            if(item.type==='1up') {
                drawStar(GAME_X + item.x, GAME_Y + item.y, 5, 12, 6, '#ffff00');
            } else {
                ctx.beginPath(); ctx.arc(GAME_X + item.x, GAME_Y + item.y, 9, 0, Math.PI*2); ctx.fill();
            }
        });
    }
    ctx.restore();
    
    ctx.fillStyle = '#ffffff'; ctx.font = '38px sans-serif';
    ctx.fillText(`SCORE: ${String(score).padStart(9, '0')}`, GAME_X + GAME_WIDTH + 60, 120);
    ctx.fillText(`POWER: ${(power/100).toFixed(2)} / 4.00`, GAME_X + GAME_WIDTH + 60, 180);
    ctx.fillText(`BOMBS: ${player.bombs} / 3`, GAME_X + GAME_WIDTH + 60, 240);
    ctx.fillText(`STAGE: ${stage === 1 ? '1' : '2 [Last Shoot]'}`, GAME_X + GAME_WIDTH + 60, 310);
    
    if (boss.active && stage === 1) {
        ctx.fillStyle = '#ffaa00'; ctx.fillText(`SPELL: ${boss.currentSpell} / ${boss.maxSpell}`, GAME_X + GAME_WIDTH + 60, 370);
    }
    
    if (gameState === 'TITLE') {
        ctx.fillStyle = 'rgba(5, 2, 15, 0.9)'; ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);
        ctx.fillStyle = '#ff2266'; ctx.font = 'bold 76px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText("LastShoot   --NECRO SHOOT--", BASE_WIDTH/2, 280);
        ctx.font = '36px sans-serif';
        for(let i=0; i<titleMenu.length; i++) {
            ctx.fillStyle = i===menuIndex ? '#00ffff' : '#ffffff';
            ctx.fillText((i===menuIndex?"▶ ":"")+titleMenu[i], BASE_WIDTH/2, 520 + i*75);
        }
        ctx.textAlign = 'left';
    } else if (gameState === 'PAUSE') {
        ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(GAME_X, GAME_Y, GAME_WIDTH, GAME_HEIGHT);
        ctx.fillStyle = '#ffffff'; ctx.font = '55px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText("PAUSE", GAME_X + GAME_WIDTH/2, GAME_Y + 300);
        ctx.font = '32px sans-serif';
        for(let i=0; i<pauseMenu.length; i++) {
            ctx.fillStyle = i===menuIndex ? '#ffff00' : '#ffffff';
            ctx.fillText((i===menuIndex?"▶ ":"")+pauseMenu[i], GAME_X + GAME_WIDTH/2, GAME_Y + 440 + i*65);
        }
        ctx.textAlign = 'left';
    } else if (gameState === 'GAMEOVER' || gameState === 'CLEAR') {
        ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(GAME_X, GAME_Y, GAME_WIDTH, GAME_HEIGHT);
        ctx.fillStyle = gameState==='CLEAR' ? '#00ffaa' : '#ff2255'; ctx.font = '68px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(gameState==='CLEAR' ? "ALL STAGE CLEAR!" : "GAME OVER", GAME_X + GAME_WIDTH/2, GAME_Y + 320);
        ctx.font = '34px sans-serif';
        for(let i=0; i<endMenu.length; i++) {
            ctx.fillStyle = i===menuIndex ? '#00ffff' : '#ffffff';
            ctx.fillText((i===menuIndex?"▶ ":"")+endMenu[i], GAME_X + GAME_WIDTH/2, GAME_Y + 470 + i*70);
        }
        ctx.textAlign = 'left';
    }
    
    if (configMode && configTarget) {
        ctx.fillStyle = 'rgba(10, 5, 30, 0.95)';
        ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);
        ctx.fillStyle = '#00ffff'; ctx.font = 'bold 50px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText("[ CONTROLLER CONFIG / BUTTON BINDING ]", BASE_WIDTH/2, 350);
        
        ctx.fillStyle = '#ffffff'; ctx.font = '38px sans-serif';
        ctx.fillText("コントローラーのボタンをどれか1つ押してください", BASE_WIDTH/2, 480);
        
        ctx.fillStyle = '#ff3388'; ctx.font = 'bold 58px sans-serif';
        ctx.fillText(`設定対象 ⇒ 【 ${CONFIG_STEPS[configStep].name} 】`, BASE_WIDTH/2, 600);
        
        ctx.fillStyle = '#888888'; ctx.font = '28px sans-serif';
        ctx.fillText("(中断するにはキーボードのESCキーを押してください)", BASE_WIDTH/2, 750);
        ctx.textAlign = 'left';
    }
    
    if (isReplaying) {
        ctx.fillStyle = '#ff2222'; ctx.font = 'bold 32px sans-serif';
        ctx.fillText(`● REPLAY MODE (${replaySpeed}x)  キーボードの[Ctrl]またはコントローラーの設定されたボタンを長押しで加速`, GAME_X + 40, GAME_Y + 50);
    }
}

function drawStar(cx, cy, spikes, outerRadius, innerRadius, color) {
    let rot = Math.PI / 2 * 3, x = cx, y = cy, step = Math.PI / spikes;
    ctx.beginPath(); ctx.moveTo(cx, cy - outerRadius);
    for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius; y = cy + Math.sin(rot) * outerRadius; ctx.lineTo(x, y); rot += step;
        x = cx + Math.cos(rot) * innerRadius; y = cy + Math.sin(rot) * innerRadius; ctx.lineTo(x, y); rot += step;
    }
    ctx.lineTo(cx, cy - outerRadius); ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}

function loop() {
    if (gameState === 'PLAY') {
        for (let i = 0; i < (isReplaying ? replaySpeed : 1); i++) {
            updateGame();
        }
    } else {
        handleMenus();
    }
    draw();
    requestAnimationFrame(loop);
}

initStars();
loop();
</script>
